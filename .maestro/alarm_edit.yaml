# 알람 생성(벨소리·메모) → 미리보기 종료 → 저장 → 목록에서 다시 열어 삭제
# 문구는 한국어·영어 기기 둘 다 맞게 정규식으로 씀
appId: com.bluepig.alarm.debug
---
# 이전 실행이 남긴 알람과 겹치지 않게 메모를 매번 다르게
- evalScript: ${output.memo = 'maestro-' + Date.now()}
- launchApp
- tapOn: "알람 생성|Create alarm"
# 화면 가운데는 시각 선택기라 기본 스크롤이 시각만 돌림 → 아래쪽에서 밀어 올림
- repeat:
    while:
      notVisible: "검색.*|(?i)search.*"
    times: 5
    commands:
      - swipe:
          start: 50%, 72%
          end: 50%, 25%
- tapOn: "검색.*|(?i)search.*"
- tapOn: "벨소리|(?i)ringtone"
- tapOn:
    childOf:
      id: ".*rv_ringtone"
- tapOn: "선택|(?i)select"
- repeat:
    while:
      notVisible: "메모를 입력해주세요\\.|Please enter a note\\."
    times: 5
    commands:
      - swipe:
          start: 50%, 72%
          end: 50%, 25%
- tapOn: "메모를 입력해주세요\\.|Please enter a note\\."
- inputText: ${output.memo}
- hideKeyboard
- tapOn: "미리보기|(?i)preview"
- assertVisible: ${output.memo}
- tapOn: "미리보기 종료|(?i)end preview"
- tapOn: "저장|(?i)save"
# 목록은 시각 순이라 기존 알람이 많으면 새 알람이 아래에 있음
- scrollUntilVisible:
    element: ${output.memo}
- tapOn: ${output.memo}
- repeat:
    while:
      notVisible: "알람 삭제|(?i)delete alarm"
    times: 5
    commands:
      - swipe:
          start: 50%, 72%
          end: 50%, 25%
- tapOn: "알람 삭제|(?i)delete alarm"
- assertNotVisible: ${output.memo}
